name: Sync all upstream releases

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-releases
  cancel-in-progress: false

env:
  UPSTREAM: cscnk52/wechat-windows-versions

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Sync all release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          gh release list -R "$UPSTREAM" --limit 1000 --json tagName --jq '.[].tagName' > tags.txt

          while read -r TAG; do
            [ -z "$TAG" ] && continue

            echo "Checking release: $TAG"

            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Already exists, skip: $TAG"
              continue
            fi

            rm -rf assets release.json release-notes.md
            mkdir -p assets

            echo "Downloading assets: $TAG"
            gh release download "$TAG" -R "$UPSTREAM" -D assets --pattern "*" --clobber || true

            gh release view "$TAG" -R "$UPSTREAM" --json name,body,isPrerelease > release.json
            jq -r '.body // ""' release.json > release-notes.md

            NAME="$(jq -r '.name // "'"$TAG"'"' release.json)"
            PRERELEASE="$(jq -r '.isPrerelease' release.json)"

            shopt -s nullglob
            FILES=(assets/*)

            echo "Creating release: $TAG"

            if [ "$PRERELEASE" = "true" ]; then
              gh release create "$TAG" "${FILES[@]}" -R "$GITHUB_REPOSITORY" -t "$NAME" -F release-notes.md --prerelease
            else
              gh release create "$TAG" "${FILES[@]}" -R "$GITHUB_REPOSITORY" -t "$NAME" -F release-notes.md
            fi

            echo "Done: $TAG"
          done < tags.txt
